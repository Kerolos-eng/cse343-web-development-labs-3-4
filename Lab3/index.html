<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Orbit Calculator | Lab 3</title>
  <link rel="stylesheet" href="lab3-calculator.css">
  <script src="lab3-calculator.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-heading">
      <p class="eyebrow">CSE343 · WEB DEVELOPMENT</p>
      <h1>Orbit <span>Calculator</span></h1>
      <p class="subtitle">A little clarity for the numbers that move you.</p>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="calc-topline"><span class="brand-mark" aria-hidden="true">◉</span><span>ORBIT / 03</span><span class="live-dot">READY</span></div>
      <div class="display" aria-live="polite" aria-atomic="true">
        <div id="expression" class="expression" aria-label="Expression"></div>
        <output id="display" class="display-value" aria-label="Calculator display">0</output>
      </div>
      <div class="keypad" id="keypad" aria-label="Calculator keys">
        <button class="key key-utility" data-action="clear" aria-label="Clear all">AC</button>
        <button class="key key-utility" data-action="sign" aria-label="Change sign">+/−</button>
        <button class="key key-utility" data-action="percent" aria-label="Percent">%</button>
        <button class="key key-operator" data-operator="÷" aria-label="Divide">÷</button>
        <button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key key-operator" data-operator="×" aria-label="Multiply">×</button>
        <button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key key-operator" data-operator="−" aria-label="Subtract">−</button>
        <button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key key-operator" data-operator="+" aria-label="Add">+</button>
        <button class="key key-zero" data-digit="0">0</button><button class="key" data-action="decimal" aria-label="Decimal point">.</button><button class="key key-operator key-equals" data-action="equals" aria-label="Equals">=</button>
      </div>
      <p class="keyboard-hint">Keyboard supported · Esc clears · Enter calculates</p>
    </section>
    <footer>Built with semantic HTML, CSS, and vanilla JavaScript.</footer>
  </main>
</body>
</html>
